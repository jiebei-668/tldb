name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --onefile --name "RailwayAutomation" --clean railway_approval.py

    - name: Prepare release files
      run: |
        mkdir release
        Copy-Item dist\RailwayAutomation.exe release\
        Copy-Item config.ini release\
        Copy-Item README.md release\

    - name: Create ZIP archive
      run: |
        Compress-Archive -Path release\* -DestinationPath RailwayAutomation-Windows.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: RailwayAutomation-Windows
        path: RailwayAutomation-Windows.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: RailwayAutomation-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
