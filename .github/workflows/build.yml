name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 设置 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 打包成 EXE
      run: |
        pyinstaller --onefile --name "铁路审批自动化" --clean railway_approval.py

    - name: 准备发布文件
      run: |
        mkdir release
        copy dist\铁路审批自动化.exe release\
        copy config.ini release\
        copy README.md release\

    - name: 创建 ZIP 压缩包
      run: |
        Compress-Archive -Path release\* -DestinationPath 铁路审批自动化-Windows.zip

    - name: 上传构建产物
      uses: actions/upload-artifact@v3
      with:
        name: 铁路审批自动化-Windows
        path: 铁路审批自动化-Windows.zip

    - name: 创建 Release (仅推送标签时)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: 铁路审批自动化-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
